# Verifica e genera il sito miglioramento.com a ogni modifica della sua cartella.
# Il sito generato si scarica dalla pagina dell'esecuzione (artifact "miglioramento-dist").
name: miglioramento.com

on:
  pull_request:
    paths: ["miglioramento.com/**", ".github/workflows/miglioramento.yml"]
  push:
    branches: [main]
    paths: ["miglioramento.com/**", ".github/workflows/miglioramento.yml"]
  workflow_dispatch:

jobs:
  verifica:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: miglioramento.com
    steps:
      - uses: actions/checkout@v4
      - name: Versioni di sito e sezioni coerenti con i CHANGELOG
        run: python3 build.py --verifica
      - name: Contrasto e daltonismo della palette
        run: python3 scripts/verifica_colori.py
      - name: Valida libro e guide con lo schema ufficiale DocBook 5
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq docbook5-xml libxml2-utils
          xmllint --noout --xinclude --relaxng /usr/share/xml/docbook/schema/rng/5.0/docbook.rng sezioni/libro/docbook/libro.xml
          for g in sezioni/guide/*/docbook/guida.xml; do
            xmllint --noout --xinclude --relaxng /usr/share/xml/docbook/schema/rng/5.0/docbook.rng "$g"
          done
      - name: Genera il sito
        run: python3 build.py
      - name: Accessibilità WCAG 2.2 AA (axe-core) su tutte le pagine
        run: |
          npm install --no-save --no-package-lock playwright@1.47.2 axe-core@4.10.2
          npx playwright install --with-deps chromium
          (cd dist && python3 -m http.server 8000 >/dev/null 2>&1 &)
          sleep 1
          node scripts/verifica_accessibilita.mjs http://localhost:8000
      - uses: actions/upload-artifact@v4
        with:
          name: miglioramento-dist
          path: miglioramento.com/dist
