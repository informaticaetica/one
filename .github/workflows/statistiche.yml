# Verifica il plugin di statistiche.top a ogni modifica della sua cartella.
# Il pacchetto installabile si scarica dalla pagina dell'esecuzione (artifact "statistiche-top-plugin").
name: statistiche.top

on:
  pull_request:
    paths: ["statistiche.top/**", ".github/workflows/statistiche.yml"]
  push:
    branches: [main]
    paths: ["statistiche.top/**", ".github/workflows/statistiche.yml"]
  workflow_dispatch:

jobs:
  verifica:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ["7.4", "8.3"]
    defaults:
      run:
        working-directory: statistiche.top
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sqlite3, pdo_sqlite
          tools: wp-cli
      - name: Sintassi PHP
        run: find plugin -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Logica (punteggi, regole, eccellenze.org)
        run: php tests/test-logica.php
      - name: Contrasto e daltonismo della palette
        run: python3 scripts/verifica_colori.py
      - name: Collaudo su WordPress (SQLite)
        run: |
          mkdir -p /tmp/wp && cd /tmp/wp
          wp core download --locale=it_IT --quiet
          wp plugin install sqlite-database-integration --quiet
          cp wp-content/plugins/sqlite-database-integration/db.copy wp-content/db.php
          sed -i "s#{SQLITE_IMPLEMENTATION_FOLDER_PATH}#$PWD/wp-content/plugins/sqlite-database-integration#; s#{SQLITE_PLUGIN}#sqlite-database-integration/load.php#" wp-content/db.php
          wp config create --dbname=wp --dbuser=wp --dbpass=wp --skip-check --quiet
          wp core install --url=http://localhost --title=statistiche.top --admin_user=admin --admin_email=admin@example.org --admin_password=prova --skip-email --quiet
          wp rewrite structure '/%postname%/' --quiet
          cp -r "$GITHUB_WORKSPACE/statistiche.top/plugin/statistiche-top" wp-content/plugins/
          wp plugin activate statistiche-top
          wp eval-file "$GITHUB_WORKSPACE/statistiche.top/tests/smoke-wordpress.php"

  pacchetto:
    needs: verifica
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Crea lo zip installabile
        run: cd statistiche.top/plugin && zip -r ../../statistiche-top.zip statistiche-top
      - uses: actions/upload-artifact@v4
        with:
          name: statistiche-top-plugin
          path: statistiche-top.zip
